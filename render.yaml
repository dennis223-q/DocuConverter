services:
  - type: web
    name: docforge
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: MAX_FILES_PER_REQUEST
        value: "20"
      - key: PROCESSING_TIMEOUT_SECONDS
        value: "180"
      - key: FILE_RETENTION_MINUTES
        value: "15"
      - key: OCR_LANGUAGES
        value: "eng,hin,spa,fra,deu"
      - key: STORAGE_PROVIDER
        value: "local"
      - key: CORS_ORIGINS
        value: "*"
